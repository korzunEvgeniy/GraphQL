version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: graphql-db
    environment:
      POSTGRES_DB: graphqldb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
